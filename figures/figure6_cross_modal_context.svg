<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="650" viewBox="0 0 1450 650">
<title>Unpaired cross-modal evidence matrix</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="55.0" y="55.0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#172033">Unpaired cross-modal evidence matrix</text>
<text x="55.0" y="88.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#4b5563">Study-level context only; RNA-seq and imaging are not sample-paired</text>
<text x="420.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#172033">Imaging</text>
<text x="790.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#172033">Transcriptomic context</text>
<text x="1180.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#172033">Integrated classification</text>
<text x="55.0" y="204.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#172033">Photoreceptor integrity</text>
<rect x="275" y="170" width="290" height="55" rx="12" fill="#e5f5eb" stroke="#25714f" stroke-width="2"/>
<text x="420.0" y="204.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#25714f">FDR-supported</text>
<rect x="645" y="170" width="290" height="55" rx="12" fill="#e5f5eb" stroke="#25714f" stroke-width="2"/>
<text x="790.0" y="204.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#25714f">FDR-supported context</text>
<rect x="1015" y="170" width="370" height="55" rx="12" fill="#e8f0ff" stroke="#3158a6" stroke-width="2"/>
<text x="1200.0" y="204.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#3158a6">study-level contextual convergence</text>
<text x="55.0" y="299.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#172033">Apoptosis</text>
<rect x="275" y="265" width="290" height="55" rx="12" fill="#e5f5eb" stroke="#25714f" stroke-width="2"/>
<text x="420.0" y="299.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#25714f">FDR-supported</text>
<rect x="645" y="265" width="290" height="55" rx="12" fill="#fff4e5" stroke="#a75b13" stroke-width="2"/>
<text x="790.0" y="299.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#a75b13">not directly tested</text>
<rect x="1015" y="265" width="370" height="55" rx="12" fill="#e8f0ff" stroke="#3158a6" stroke-width="2"/>
<text x="1200.0" y="299.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#3158a6">imaging-only FDR-supported evidence</text>
<text x="55.0" y="394.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#172033">Oxidative stress</text>
<rect x="275" y="360" width="290" height="55" rx="12" fill="#f2f4f7" stroke="#596579" stroke-width="2"/>
<text x="420.0" y="394.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#596579">not FDR-supported</text>
<rect x="645" y="360" width="290" height="55" rx="12" fill="#fff4e5" stroke="#a75b13" stroke-width="2"/>
<text x="790.0" y="394.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#a75b13">broad context only</text>
<rect x="1015" y="360" width="370" height="55" rx="12" fill="#f2f4f7" stroke="#596579" stroke-width="2"/>
<text x="1200.0" y="394.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#596579">no cross-modal convergence claim</text>
<text x="55.0" y="489.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#172033">Vascular/barrier integrity</text>
<rect x="275" y="455" width="290" height="55" rx="12" fill="#f2f4f7" stroke="#596579" stroke-width="2"/>
<text x="420.0" y="489.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#596579">not FDR-supported</text>
<rect x="645" y="455" width="290" height="55" rx="12" fill="#f2f4f7" stroke="#596579" stroke-width="2"/>
<text x="790.0" y="489.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#596579">not FDR-supported</text>
<rect x="1015" y="455" width="370" height="55" rx="12" fill="#f2f4f7" stroke="#596579" stroke-width="2"/>
<text x="1200.0" y="489.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#596579">no cross-modal convergence claim</text>
<text x="55.0" y="590.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#a8324a">Photoreceptor convergence does not imply paired association or causal mediation.</text>
<text x="55.0" y="620.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#4b5563">Apoptosis is imaging-only; oxidative and vascular/barrier domains do not cross the current FDR boundary.</text>
</svg>